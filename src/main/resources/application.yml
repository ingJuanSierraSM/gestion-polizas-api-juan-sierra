spring:
  application:
    name: gestion-polizas

  datasource:
    url: jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: 8080

app:
  security:
    api-key: ${API_KEY:123456}

logging:
  level:
    root: INFO
    com.juansierrasegurosbolivar.gestion-polizas: INFO